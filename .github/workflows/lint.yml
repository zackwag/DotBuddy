name: Lint

# Runs SwiftLint (configured via .swiftlint.yml) against the codebase.
# --strict fails the build on warnings too, so the codebase stays at the
# zero-violations baseline instead of silently accumulating new ones.

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  swiftlint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run SwiftLint
        uses: docker://ghcr.io/realm/swiftlint:latest
        with:
          args: lint --strict --reporter github-actions-logging
