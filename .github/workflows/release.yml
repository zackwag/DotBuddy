name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain

          echo "$CERTIFICATE_P12" | base64 --decode > $CERTIFICATE_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Build and archive
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          xcodebuild archive \
            -project DotBuddy.xcodeproj \
            -scheme DotBuddy \
            -configuration Release \
            -archivePath $RUNNER_TEMP/DotBuddy.xcarchive \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            ENABLE_HARDENED_RUNTIME=YES

      - name: Export app
        run: |
          cat > $RUNNER_TEMP/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>developer-id</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/DotBuddy.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export

      - name: Notarize app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          cd $RUNNER_TEMP/export
          ditto -c -k --keepParent DotBuddy.app DotBuddy.zip

          SUBMIT_OUTPUT=$(xcrun notarytool submit DotBuddy.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait 2>&1) || true
          echo "$SUBMIT_OUTPUT"

          SUBMISSION_ID=$(echo "$SUBMIT_OUTPUT" | grep "id:" | head -1 | awk '{print $2}')

          if echo "$SUBMIT_OUTPUT" | grep -q "status: Invalid"; then
            echo "Notarization failed. Fetching log..."
            xcrun notarytool log "$SUBMISSION_ID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$TEAM_ID"
            exit 1
          fi

          xcrun stapler staple DotBuddy.app

      - name: Package for release
        run: |
          cd $RUNNER_TEMP/export
          ditto -c -k --keepParent DotBuddy.app DotBuddy.zip

      - name: Attach app to the release-please-created release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4 5; do
            if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
              break
            fi
            echo "Release for ${{ github.ref_name }} not found yet, retrying..."
            sleep 5
          done
          gh release upload "${{ github.ref_name }}" "${{ runner.temp }}/export/DotBuddy.zip" --clobber

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(shasum -a 256 $RUNNER_TEMP/export/DotBuddy.zip | awk '{print $1}')
          BRANCH="update-dotbuddy-${VERSION}"

          git clone https://x-access-token:${TAP_TOKEN}@github.com/zackwag/homebrew-tap.git /tmp/tap
          cd /tmp/tap
          git checkout -b "$BRANCH"

          cat > Casks/dotbuddy.rb << EOF
          cask "dotbuddy" do
            version "${VERSION}"
            sha256 "${SHA}"

            url "https://github.com/zackwag/DotBuddy/releases/download/v${VERSION}/DotBuddy.zip"
            name "DotBuddy"
            desc "Manage your shell aliases and environment variables"
            homepage "https://github.com/zackwag/DotBuddy"

            depends_on macos: :sonoma

            app "DotBuddy.app"

            zap trash: "~/Library/Preferences/dev.zackwag.DotBuddy.plist"
          end
          EOF
          sed -i '' 's/^          //' Casks/dotbuddy.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/dotbuddy.rb
          git diff --cached --quiet && exit 0
          git commit -m "chore(dotbuddy): update to ${VERSION}"
          git push origin "$BRANCH"

          export GH_TOKEN="$TAP_TOKEN"
          gh pr create --repo zackwag/homebrew-tap --base main --head "$BRANCH" \
            --title "chore(dotbuddy): update to ${VERSION}" \
            --body "Automated update from a DotBuddy release."

          pr_number=$(gh pr list --repo zackwag/homebrew-tap --head "$BRANCH" --json number -q '.[0].number')
          sleep 20
          for i in $(seq 1 40); do
            total=$(gh pr view "$pr_number" --repo zackwag/homebrew-tap --json statusCheckRollup -q '.statusCheckRollup | length')
            pending=$(gh pr view "$pr_number" --repo zackwag/homebrew-tap --json statusCheckRollup -q '[.statusCheckRollup[] | select(.status!="COMPLETED")] | length')
            if [ "$total" != "0" ] && [ "$pending" = "0" ]; then break; fi
            sleep 15
          done

          bad=$(gh pr view "$pr_number" --repo zackwag/homebrew-tap --json statusCheckRollup -q '[.statusCheckRollup[] | select((.conclusion // "") | IN("SUCCESS","NEUTRAL","SKIPPED") | not)] | length')
          if [ "$bad" != "0" ]; then
            echo "::error::$bad check(s) did not succeed; leaving PR #$pr_number open for review."
            exit 1
          fi

          gh pr merge "$pr_number" --repo zackwag/homebrew-tap --squash --delete-branch
